[build-system]
requires = [
  "scikit-build-core",
  "nanobind",
  "numpy"
]
build-backend = "scikit_build_core.build"

[project]
name = "fdaPDE"
version = "2.0.0rc6"
description="The python wrapper to the fdaPDE library for physics-informed spatial and functional data analysis."
readme = "README.md"
dependencies = ["numpy"]
authors = [
  { name = "Alessandro Palummo", email = "alessandro.palummo@polimi.it" },
  { name = "Ilenia Di Battista", email = "ilenia.dibattista@polimi.it"  },
]
requires-python = ">=3.11"
license = { file = "LICENSE" }
